<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD BIARENSE - Voleibol</title>

    <!-- FAVICONS Y MANIFIESTO CON RUTA ABSOLUTA Y ANTI-CACHÉ -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://rafaleorioo.github.io/voleybot/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="https://rafaleorioo.github.io/voleybot/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="https://rafaleorioo.github.io/voleybot/favicon-16x16.png?v=2">
    <link rel="manifest" href="https://rafaleorioo.github.io/voleybot/site.webmanifest?v=2">
    <link rel="shortcut icon" href="https://rafaleorioo.github.io/voleybot/favicon.ico?v=2">

    <!-- Configuración Web App Mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CD BIARENSE">
    <meta name="application-name" content="CD BIARENSE">
    <meta name="theme-color" content="#0a0e17">

    <!-- Fuentes deportivas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos deportivos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: rgba(23, 31, 48, 0.85);
            --border-glow: rgba(59, 130, 246, 0.25);
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            --win-glow: #10b981;
            --win-bg: rgba(16, 185, 129, 0.15);
            --loss-glow: #ef4444;
            --pending-bg: rgba(148, 163, 184, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .header img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Botón de Volver Atrás */
        .back-btn-container {
            display: none;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 600px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-blue);
        }

        /* Menú de Selección Atractivo (Pantalla 1) */
        .selector-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .selector-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 480px) {
            .categories-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .category-card.femenino::before {
            background: linear-gradient(90deg, #ec4899, #f472b6);
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 15px 35px 0 rgba(59, 130, 246, 0.25);
        }

        .category-card.femenino:hover {
            border-color: #ec4899;
            box-shadow: 0 15px 35px 0 rgba(236, 72, 153, 0.25);
        }

        .category-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 4px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            transition: transform 0.3s;
        }

        .category-card.femenino .category-icon {
            background: rgba(236, 72, 153, 0.12);
            color: #f472b6;
            border-color: rgba(236, 72, 153, 0.3);
        }

        .category-card:hover .category-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .category-card h2 {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-card p {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-badge-action {
            margin-top: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .category-card.femenino .category-badge-action {
            color: #fbcfe8;
        }

        .category-card:hover .category-badge-action {
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Contenedor de Partidos Original */
        .container {
            width: 100%;
            max-width: 600px;
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .jornada-badge {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .status-victoria {
            background: var(--win-bg);
            color: var(--win-glow);
            border: 1px solid var(--win-glow);
        }

        .status-derrota {
            background: rgba(239, 68, 68, 0.15);
            color: var(--loss-glow);
            border: 1px solid var(--loss-glow);
        }

        .status-pendiente {
            background: var(--pending-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .match-info {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            text-align: center;
            margin: 10px 0;
        }

        .team {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .team.highlight {
            color: #60a5fa;
        }

        .score-board {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .parciales-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .parciales-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .sets-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .set-pill {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .location-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.15);
            padding: 8px 12px;
            border-radius: 8px;
            color: #bfdbfe;
            gap: 10px;
        }

        .maps-btn {
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 6px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .maps-btn:hover {
            background: #2563eb;
        }

        .descanso-card {
            text-align: center;
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .descanso-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 8px 0 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://rafaleorioo.github.io/voleybot/apple-touch-icon.png" alt="CD Biarense Logo">
        <h1 id="main-title">CD BIARENSE</h1>
        <p id="main-subtitle">Selecciona una categoría</p>
    </div>

    <!-- Botón para volver al selector de categorías -->
    <div class="back-btn-container" id="back-btn-container">
        <button class="back-btn" onclick="volverAlSelector()"><i class="fa-solid fa-arrow-left"></i> Cambiar de categoría</button>
    </div>

    <!-- PANTALLA 1: Menú de selección atractivo y deportivo -->
    <div class="selector-screen" id="selector-screen">
        <p class="selector-title">Selecciona un Equipo</p>
        <div class="categories-grid">
            
            <!-- Botón Senior Masculino -->
            <div class="category-card" onclick="cargarCategoria('partidos.json', 'Voleibol Senior Masculino')">
                <div class="category-icon">
                    <i class="fa-solid fa-volleyball"></i>
                </div>
                <h2>Senior Masculino</h2>
                <p>Grupo 3 · 2ª División</p>
                <span class="category-badge-action">Ver calendario <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
            </div>

            <!-- Botón Juvenil Femenino -->
            <div class="category-card femenino" onclick="cargarCategoria('partidos_femenino.json', 'Voleibol Juvenil Femenino')">
                <div class="category-icon">
                    <i class="fa-solid fa-volleyball"></i>
                </div>
                <h2>Juvenil Femenino</h2>
                <p>Grupo 2 · 2ª División</p>
                <span class="category-badge-action">Ver calendario <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
            </div>

        </div>
    </div>

    <!-- PANTALLA 2: Contenedor con las jornadas originales -->
    <div class="container" id="partidos-container">
        <!-- Las tarjetas se cargarán dinámicamente aquí -->
    </div>

    <script>
        function volverAlSelector() {
            document.getElementById('partidos-container').style.display = 'none';
            document.getElementById('selector-screen').style.display = 'flex';
            document.getElementById('back-btn-container').style.display = 'none';
            document.getElementById('main-subtitle').innerText = 'Selecciona una categoría';
        }

        async function cargarCategoria(archivoJson, subtituloTexto) {
            document.getElementById('selector-screen').style.display = 'none';
            document.getElementById('partidos-container').style.display = 'flex';
            document.getElementById('back-btn-container').style.display = 'block';
            document.getElementById('main-subtitle').innerText = subtituloTexto;

            const contenedor = document.getElementById('partidos-container');
            contenedor.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 20px;">Cargando partidos...</p>';
            
            try {
                const respuesta = await fetch(`${archivoJson}?t=${new Date().getTime()}`);
                const partidosGuardados = await respuesta.json();

                contenedor.innerHTML = '';

                const mapaPartidos = {};
                partidosGuardados.forEach(p => {
                    const numJ = parseInt(p.jornada.replace(/\D/g, ''));
                    if (numJ) mapaPartidos[numJ] = p;
                });

                for (let i = 1; i <= 26; i++) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const p = mapaPartidos[i];

                    if (!p) {
                        card.className = 'card descanso-card';
                        card.innerHTML = `
                            <span class="jornada-badge">Jornada ${i}</span>
                            <div class="descanso-title">☕ JORNADA DE DESCANSO</div>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">El equipo no disputa ningún encuentro en esta jornada.</p>
                        `;
                    } else {
                        const estadoClass = `status-${p.estado.toLowerCase()}`;
                        const esCasa = p.condicion === 'Casa';
                        const iconoCondicion = esCasa ? '🏠 Casa' : '🚗 Fuera';
                        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.ubicacion)}`;

                        let parcialesHTML = '';
                        if (p.parciales) {
                            const sets = p.parciales.split('/').map(s => s.trim()).filter(Boolean);
                            let setsPills = sets.map((set, index) => `<span class="set-pill">S${index + 1}: ${set}</span>`).join('');
                            
                            parcialesHTML = `
                                <div class="parciales-container">
                                    <span class="parciales-title">📊 Parciales por Set</span>
                                    <div class="sets-grid">${setsPills}</div>
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="card-header">
                                <span class="jornada-badge">${p.jornada}</span>
                                <span class="status-badge ${estadoClass}">${p.estado}</span>
                            </div>
                            <div class="match-info">
                                <div class="team ${p.local.includes('BIARENSE') ? 'highlight' : ''}">${p.local}</div>
                                <div class="score-board">${p.resultado || 'VS'}</div>
                                <div class="team ${p.visitante.includes('BIARENSE') ? 'highlight' : ''}">${p.visitante}</div>
                            </div>
                            ${parcialesHTML}
                            <div class="details">
                                <div class="details-row">
                                    <div class="detail-item">📅 <span>${p.fecha}</span></div>
                                    <div class="detail-item">⏰ <span>${p.hora || 'Por definir'}</span></div>
                                    <div class="detail-item">📍 <span>${iconoCondicion}</span></div>
                                </div>
                                <div class="location-box">
                                    <span>🏟️ <strong>Ubicación:</strong> ${p.ubicacion}</span>
                                    <a href="${mapsUrl}" target="_blank" class="maps-btn">📍 Ver en Maps</a>
                                </div>
                            </div>
                        `;
                    }

                    contenedor.appendChild(card);
                }

            } catch (error) {
                console.error('Error al cargar partidos:', error);
                contenedor.innerHTML = '<p style="text-align:center; color:#ef4444;">Error cargando los partidos. Asegúrate de haber generado los JSON ejecutando el bot.</p>';
            }
        }
    </script>
</body>
</html>
