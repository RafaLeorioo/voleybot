<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD BIARENSE - Voleibol</title>
    <!-- Fuentes deportivas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: rgba(23, 31, 48, 0.75);
            --border-glow: rgba(59, 130, 246, 0.2);
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --win-glow: #10b981;
            --win-bg: rgba(16, 185, 129, 0.15);
            --loss-glow: #ef4444;
            --pending-bg: rgba(148, 163, 184, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 50% 0%, rgba(30, 58, 138, 0.3) 0px, transparent 70%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px 12px;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        header h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 30%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 0.95;
            filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.2));
        }

        header p {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            font-weight: 600;
        }

        .match-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
        }

        /* Tira lateral indicadora de estado */
        .match-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .match-card.Victoria::before { background: var(--win-glow); box-shadow: 0 0 10px var(--win-glow); }
        .match-card.Derrota::before { background: var(--loss-glow); }
        .match-card.Pendiente::before { background: var(--text-muted); }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .jornada-badge {
            font-family: 'Teko', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
            padding: 1px 10px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            line-height: 1.2;
        }

        .match-info {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-left: auto;
        }

        .status-badge.Victoria {
            background: var(--win-bg);
            color: var(--win-glow);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.Pendiente {
            background: var(--pending-bg);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        /* SCOREBOARD ADAPTATIVO */
        .scoreboard {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0;
            background: rgba(10, 14, 23, 0.5);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .team-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #94a3b8;
            word-break: break-word;
            line-height: 1.25;
            flex: 1;
        }

        .team-row.target .team-name {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .team-score {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(10, 14, 23, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            min-width: 38px;
            text-align: center;
            line-height: 1;
            padding: 4px 6px;
        }

        /* Botón dinámico de Google Maps */
        .location-box {
            margin-top: 10px;
            font-size: 0.78rem;
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease-in-out;
        }

        .location-box:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .parciales-box {
            margin-top: 8px;
            background: rgba(10, 14, 23, 0.3);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            word-break: break-all;
        }

        .parciales-box strong {
            color: #e2e8f0;
        }

        /* VISTA PARA TABLETS Y PC */
        @media (min-width: 550px) {
            header h1 { font-size: 3.6rem; }
            header p { font-size: 0.9rem; }
            .match-card { padding: 20px 24px; }
            
            .scoreboard {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 14px;
                background: transparent;
                padding: 0;
                border: none;
            }

            .team-row {
                flex-direction: column;
                justify-content: center;
            }

            .team-row.local { text-align: right; }
            .team-row.visitante { text-align: left; }

            .team-name { font-size: 1.05rem; }
            .team-score { display: none; }
            
            .score-box-pc {
                display: block;
                font-family: 'Teko', sans-serif;
                font-size: 2.2rem;
                font-weight: 700;
                background: rgba(10, 14, 23, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                padding: 2px 18px;
                color: #ffffff;
                text-align: center;
                min-width: 75px;
            }
        }

        @media (max-width: 549px) {
            .score-box-pc { display: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CD BIARENSE</h1>
            <p>2ª Autonómica Masculino • Grupo 3</p>
        </header>

        <div id="partidos-list"></div>
    </div>

    <script>
        async function cargarPartidos() {
            try {
                const response = await fetch('partidos.json');
                const partidos = await response.json();
                
                const contenedor = document.getElementById('partidos-list');
                contenedor.innerHTML = '';

                partidos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = `match-card ${p.estado}`;

                    const isLocalTarget = p.local.toUpperCase().includes('BIARENSE');
                    const isVisitanteTarget = p.visitante.toUpperCase().includes('BIARENSE');

                    let setLocal = "-";
                    let setVisitante = "-";
                    if (p.resultado && p.resultado.includes('-')) {
                        const partes = p.resultado.split('-');
                        setLocal = partes[0].trim();
                        setVisitante = partes[1].trim();
                    }

                    card.innerHTML = `
                        <div class="match-header">
                            <span class="jornada-badge">${p.jornada}</span>
                            <div class="match-info">
                                <span>📅 ${p.fecha}</span>
                                <span>🏠 ${p.condicion}</span>
                            </div>
                            <span class="status-badge ${p.estado}">${p.estado}</span>
                        </div>

                        <div class="scoreboard">
                            <!-- Fila Local -->
                            <div class="team-row local ${isLocalTarget ? 'target' : ''}">
                                <span class="team-name">${p.local}</span>
                                <span class="team-score">${setLocal}</span>
                            </div>

                            <!-- Marcador Centralizado para PC -->
                            <div class="score-box-pc">${p.resultado}</div>

                            <!-- Fila Visitante -->
                            <div class="team-row visitante ${isVisitanteTarget ? 'target' : ''}">
                                <span class="team-name">${p.visitante}</span>
                                <span class="team-score">${setVisitante}</span>
                            </div>
                        </div>

                        ${p.ubicacion ? `
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.ubicacion)}" target="_blank" class="location-box">
                                <span>📍 <strong>Pabellón:</strong> ${p.ubicacion}</span>
                                <span style="font-size: 0.72rem; opacity: 0.85; font-weight: 600;">Abrir Maps ↗</span>
                            </a>
                        ` : ''}

                        ${p.parciales ? `
                            <div class="parciales-box">
                                📊 <strong>PARCIALES:</strong> ${p.parciales.split('/').join('  •  ')}
                            </div>
                        ` : ''}
                    `;

                    contenedor.appendChild(card);
                });
            } catch (error) {
                console.error('Error cargando partidos:', error);
            }
        }

        cargarPartidos();
    </script>
</body>
</html>
