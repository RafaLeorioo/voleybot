<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD BIARENSE - Voleibol</title>
    <!-- Fuente deportiva e impactante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: rgba(23, 31, 48, 0.7);
            --border-glow: rgba(59, 130, 246, 0.2);
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --win-glow: #10b981;
            --win-bg: rgba(16, 185, 129, 0.15);
            --loss-glow: #ef4444;
            --pending-bg: rgba(148, 163, 184, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 50% 0%, rgba(30, 58, 138, 0.3) 0px, transparent 70%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        header h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 30%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 0.9;
            filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.2));
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: 600;
        }

        .match-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 22px 26px;
            margin-bottom: 22px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .match-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.15);
        }

        /* Tira de color lateral según el resultado */
        .match-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            border-radius: 20px 0 0 20px;
        }

        .match-card.Victoria::before { background: var(--win-glow); box-shadow: 0 0 10px var(--win-glow); }
        .match-card.Derrota::before { background: var(--loss-glow); }
        .match-card.Pendiente::before { background: var(--text-muted); }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .jornada-badge {
            font-family: 'Teko', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 12px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .match-info {
            color: var(--text-muted);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .status-badge {
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge.Victoria {
            background: var(--win-bg);
            color: var(--win-glow);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.Pendiente {
            background: var(--pending-bg);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            margin: 18px 0;
        }

        .team {
            font-size: 1.05rem;
            font-weight: 700;
            color: #cbd5e1;
            line-height: 1.3;
        }

        .team.target {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        .team.local { text-align: right; }
        .team.visitante { text-align: left; }

        .score-box {
            font-family: 'Teko', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2px 18px;
            color: #ffffff;
            min-width: 70px;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .parciales-box {
            margin-top: 16px;
            background: rgba(10, 14, 23, 0.4);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .parciales-box strong {
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CD BIARENSE</h1>
            <p>2ª Autonómica Masculino • Grupo 3</p>
        </header>

        <div id="partidos-list"></div>
    </div>

    <script>
        async function cargarPartidos() {
            try {
                const response = await fetch('partidos.json');
                const partidos = await response.json();
                
                const contenedor = document.getElementById('partidos-list');
                contenedor.innerHTML = '';

                partidos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = `match-card ${p.estado}`;

                    const isLocalTarget = p.local.toUpperCase().includes('BIARENSE');
                    const isVisitanteTarget = p.visitante.toUpperCase().includes('BIARENSE');

                    card.innerHTML = `
                        <div class="match-header">
                            <span class="jornada-badge">${p.jornada}</span>
                            <div class="match-info">
                                <span>📅 ${p.fecha}</span>
                                <span>📍 ${p.condicion}</span>
                            </div>
                            <span class="status-badge ${p.estado}">${p.estado}</span>
                        </div>

                        <div class="scoreboard">
                            <div class="team local ${isLocalTarget ? 'target' : ''}">${p.local}</div>
                            <div class="score-box">${p.resultado}</div>
                            <div class="team visitante ${isVisitanteTarget ? 'target' : ''}">${p.visitante}</div>
                        </div>

                        ${p.parciales ? `
                            <div class="parciales-box">
                                📊 <strong>PARCIALES:</strong> ${p.parciales.split('/').join('  •  ')}
                            </div>
                        ` : ''}
                    `;

                    contenedor.appendChild(card);
                });
            } catch (error) {
                console.error('Error cargando partidos:', error);
            }
        }

        cargarPartidos();
    </script>
</body>
</html>
