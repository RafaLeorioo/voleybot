<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD Biarense - Voleibol</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js para las Gráficas de Métricas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Archivos CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="metrics.css">
</head>
<body>

    <!-- Cabecera Principal -->
    <header class="header">
        <img src="android-chrome-192x192.png" alt="Escudo CD Biarense" id="club-logo">
        <h1>CD Biarense</h1>
        <p id="main-subtitle"></p>
    </header>

    <!-- Pantalla de Selección de Categorías (Menú Principal 2x2) -->
    <div id="selector-screen" class="selector-screen">
        <h2 class="selector-title">Categorías</h2>
        <div class="categories-grid">
            <div class="category-card senior" onclick="cargarCategoria('partidos.json', 'clasificacion.json', 'Voleibol Senior Masculino', 'https://fvbcv.com/exportar_competiciones.php?idens=1825', 'senior')">
                <div class="category-icon"><i class="fa-solid fa-user-group"></i></div>
                <h2>Senior</h2>
                <p>Masculino</p>
                <span class="category-badge-action">Ver &gt;</span>
            </div>
            <div class="category-card femenino" onclick="cargarCategoria('partidos_femenino.json', 'clasificacion_femenino.json', 'Voleibol Juvenil Femenino', 'https://fvbcv.com/exportar_competiciones.php?idens=1812', 'femenino')">
                <div class="category-icon"><i class="fa-solid fa-person-dress"></i></div>
                <h2>Juvenil</h2>
                <p>Femenino</p>
                <span class="category-badge-action">Ver &gt;</span>
            </div>
            <div class="category-card infantil" onclick="cargarCategoria('partidos_infantil.json', 'clasificacion_infantil.json', 'Voleibol Infantil Femenino', 'https://fvbcv.com/exportar_competiciones.php?idens=1850', 'infantil')">
                <div class="category-icon"><i class="fa-solid fa-child"></i></div>
                <h2>Infantil</h2>
                <p>Femenino</p>
                <span class="category-badge-action">Ver &gt;</span>
            </div>
            <div class="category-card cadete" onclick="cargarCategoria('partidos_cadete.json', 'clasificacion_cadete.json', 'Voleibol Cadete Femenino', 'https://fvbcv.com/exportar_competiciones.php?idens=1801', 'cadete')">
                <div class="category-icon"><i class="fa-solid fa-medal"></i></div>
                <h2>Cadete</h2>
                <p>Femenino</p>
                <span class="category-badge-action">Ver &gt;</span>
            </div>
        </div>

        <h2 class="selector-title" style="margin-top: 10px;">Próximos Encuentros</h2>
        <div id="global-previews-container" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Se rellena dinámicamente con los próximos partidos de cada categoría -->
        </div>
    </div>

    <!-- Contenedores para las Vistas de Categoría (Partidos, Clasificación y Métricas) -->
    <div id="partidos-container" class="container" style="display: none;"></div>
    <div id="clasificacion-container" class="container" style="display: none;"></div>
    <div id="metrics-container" class="container" style="display: none;"></div>

    <!-- Barra de Navegación Inferior Flotante (Optimizada) -->
    <nav id="bottom-nav-bar" class="bottom-nav-bar" style="display: none;">
        <!-- Botón de Retroceso Compacto (Flecha Izquierda) -->
        <button class="floating-btn" onclick="volverAlSelector()" title="Volver a Categorías">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <!-- Botón para alternar entre Partidos y Clasificación -->
        <button id="toggle-view-btn" class="floating-btn accent-btn" onclick="alternarVista()">
            <i id="toggle-icon" class="fa-solid fa-table-list"></i>
            <span id="toggle-text">Clasificación</span>
        </button>
        <!-- Botón para abrir el panel de Métricas y Gráficas -->
        <button class="floating-btn" onclick="cambiarAVistaMetricas()">
            <i class="fa-solid fa-chart-pie"></i> Stats
        </button>
        <!-- Enlace a la Federación -->
        <a id="fvbcv-link" href="#" target="_blank" class="floating-btn">
            <i class="fa-solid fa-globe"></i> FVBcv
        </a>
    </nav>

    <!-- Archivos JavaScript -->
    <script src="app.js"></script>
    <script src="metrics.js"></script>
</body>
</html>
