<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD BIARENSE - Voleibol</title>

    <!-- FAVICONS Y MANIFIESTO CON RUTA ABSOLUTA Y ANTI-CACHÉ -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://rafaleorioo.github.io/voleybot/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="https://rafaleorioo.github.io/voleybot/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="https://rafaleorioo.github.io/voleybot/favicon-16x16.png?v=2">
    <link rel="manifest" href="https://rafaleorioo.github.io/voleybot/site.webmanifest?v=2">
    <link rel="shortcut icon" href="https://rafaleorioo.github.io/voleybot/favicon.ico?v=2">

    <!-- Configuración Web App Mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CD BIARENSE">
    <meta name="application-name" content="CD BIARENSE">
    <meta name="theme-color" content="#0a0e17">

    <!-- Fuentes deportivas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: rgba(23, 31, 48, 0.85);
            --border-glow: rgba(59, 130, 246, 0.25);
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            --win-glow: #10b981;
            --win-bg: rgba(16, 185, 129, 0.15);
            --loss-glow: #ef4444;
            --pending-bg: rgba(148, 163, 184, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 600px;
        }

        .header img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .jornada-badge {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .status-victoria {
            background: var(--win-bg);
            color: var(--win-glow);
            border: 1px solid var(--win-glow);
        }

        .status-derrota {
            background: rgba(239, 68, 68, 0.15);
            color: var(--loss-glow);
            border: 1px solid var(--loss-glow);
        }

        .status-pendiente {
            background: var(--pending-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .match-info {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            text-align: center;
            margin: 10px 0;
        }

        .team {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .team.highlight {
            color: #60a5fa;
        }

        .score-board {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .details {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .parciales {
            font-style: italic;
            color: #cbd5e1;
            font-size: 0.8rem;
        }

        .btn-update {
            margin-top: 20px;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid var(--accent-blue);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-update:active {
            transform: scale(0.96);
            background: var(--accent-blue);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://rafaleorioo.github.io/voleybot/apple-touch-icon.png" alt="CD Biarense Logo">
        <h1>CD BIARENSE</h1>
        <p>Voleibol Senior Masculino</p>
    </div>

    <div class="container" id="partidos-container">
        <!-- Las tarjetas se cargarán dinámicamente aquí -->
    </div>

    <button class="btn-update" onclick="cargarPartidos()">🔄 Actualizar Calendario</button>

    <script>
        async function cargarPartidos() {
            const contenedor = document.getElementById('partidos-container');
            
            try {
                // PARÁMETRO ANTI-CACHÉ AÑADIDO A CONTINUACIÓN (?t=timestamp)
                const respuesta = await fetch(`partidos.json?t=${new Date().getTime()}`);
                const partidos = await respuesta.json();

                contenedor.innerHTML = '';

                partidos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const estadoClass = `status-${p.estado.toLowerCase()}`;
                    const esCasa = p.condicion === 'Casa';
                    const iconoCondicion = esCasa ? '🏠' : '🚗';

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="jornada-badge">${p.jornada}</span>
                            <span class="status-badge ${estadoClass}">${p.estado}</span>
                        </div>
                        <div class="match-info">
                            <div class="team ${p.local.includes('BIARENSE') ? 'highlight' : ''}">${p.local}</div>
                            <div class="score-board">${p.resultado || 'VS'}</div>
                            <div class="team ${p.visitante.includes('BIARENSE') ? 'highlight' : ''}">${p.visitante}</div>
                        </div>
                        <div class="details">
                            <div class="detail-item">
                                <span>📅 ${p.fecha} - ⏰ ${p.hora || 'Por definir'}</span>
                            </div>
                            <div class="detail-item">
                                <span>${iconoCondicion} (${p.condicion}) - 📍 ${p.ubicacion}</span>
                            </div>
                            ${p.parciales ? `<div class="detail-item parciales">📊 Parciales: ${p.parciales}</div>` : ''}
                        </div>
                    `;

                    contenedor.appendChild(card);
                });
            } catch (error) {
                console.error('Error al cargar partidos:', error);
                contenedor.innerHTML = '<p style="text-align:center; color:#ef4444;">Error cargando los partidos. Inténtalo de nuevo más tarde.</p>';
            }
        }

        // Cargar los partidos al iniciar la página
        cargarPartidos();
    </script>
</body>
</html>
