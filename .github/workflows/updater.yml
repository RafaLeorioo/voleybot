name: Actualizar Resultados Voleibol

on:
  schedule:
    # Se ejecuta cada 4 horas los domingos (0), lunes (1) y martes (2)
    # Expresión Cron: Minuto 0, cada 4 horas, solo días 0, 1 y 2 de la semana
    - cron: '0 */4 * * 0,1,2'
  workflow_dispatch: # Permite forzar la ejecución manual desde la web cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar Bot
        run: python bot.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add partidos.json
          git commit -m "Auto-actualizacion de resultados partidos.json [skip ci]" || exit 0
          git push
