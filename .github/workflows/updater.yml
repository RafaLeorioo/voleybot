name: Actualizar Voleibol Bot

on:
  schedule:
    # Se ejecuta los domingos, lunes y martes a las 08:00 y a las 16:00 (Hora UTC)
    - cron: '0 8,16 * * 0,1,2'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Ejecutar Bot
        run: python bot.py

      - name: Subir cambios a GitHub automáticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Actualización automática de partidos y resultados"
          branch: main